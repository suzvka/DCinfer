# Release workflow（P2-14）：v* tag 触发完整验证 + 发布物 + 供应链证明。
#
# 产出：
#   - Linux/Windows 安装树包（tar.gz / zip）
#   - SHA256SUMS 校验和文件
#   - SPDX SBOM（syft，扫描最终 Core+DCIr 安装树；Linux 路径生成）
#   - build provenance attestation（actions/attest-build-provenance，SLSA v1）
#
# 依赖仓库设置：master/main 分支保护 + required checks（ci.yml 通过后 tag
# 才可信）。本 workflow 需要写权限发布 release 与 id-token 生成 attestation。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # attest-build-provenance 经 OIDC 向 Sigstore 集群签名
      attestations: write # 签名后经 attestations REST API 持久化到仓库
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: sdk-release
            pkg: tar.gz
          - os: windows-latest
            preset: sdk-release
            pkg: zip
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - id: meta
        name: Extract and validate tag version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^project(DCinfer VERSION \([^)]*\)).*/\1/p' CMakeLists.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          [[ "$version" == "$project_version" ]] || { echo "Tag $version != CMake project version $project_version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "project_version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Assert SDK release boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"DCINFER_BUILD_ENGINES": "OFF"' CMakePresets.json
          grep -q '"DCINFER_BUILD_DCNET": "OFF"' CMakePresets.json

      - name: Setup Ninja
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Configure (Release preset, includes DCIr)
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config Release

      # sdk-release intentionally disables tests; the full matrix is covered by ci.yml.
      - name: Verify SDK CTest registration
        run: ctest --test-dir build/${{ matrix.preset }} -C Release --show-only

      - name: Install to prefix
        run: cmake --install build/${{ matrix.preset }} --prefix "${{ github.workspace }}/install-prefix"

      - name: Consumer smoke and install-boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f install-prefix/include/InferGraph.h
          test -f install-prefix/include/Ir/GraphCompiler.h
          test -f install-prefix/lib/cmake/DCinfer/DCinferConfig.cmake
          test -f install-prefix/lib/cmake/DCIr/DCIrConfig.cmake
          if find install-prefix -iname '*engine*' -o -iname '*onnx*' | grep -q .; then
            echo 'SDK install tree contains an engine artifact' >&2
            exit 1
          fi
          cmake -S examples/install_smoke -B build/install-smoke \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-prefix" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/vcpkg-toolchain.cmake" \
            -DSMOKE_WITH_IR=ON -DSMOKE_SDK=ON \
            -DSMOKE_EXPECT_VERSION="${{ steps.meta.outputs.version }}"
          cmake --build build/install-smoke --config Release
          if [ "${RUNNER_OS}" = "Windows" ]; then build/install-smoke/Release/install_smoke.exe; else build/install-smoke/install_smoke; fi

      # SBOM：明确扫描最终 SDK 安装树（必须在打包移动目录前执行）
      - name: Generate SDK install-tree SBOM
        if: runner.os == 'Linux'
        uses: anchore/sbom-action@6b31fa7e2d592e47d95d2a5e0520a7352d47ead5
        with:
          path: install-prefix
          format: spdx-json
          artifact-name: sbom-scan.json
          upload-artifact: false
          output-file: sbom-scan.json

      - name: Package install tree
        shell: bash
        run: |
          set -e
          NAME="dcinfer-${{ steps.meta.outputs.version }}-${RUNNER_OS,,}-x64"
          mv install-prefix "$NAME"
          if [ "${{ matrix.pkg }}" = "tar.gz" ]; then
            tar -czf "$NAME.tar.gz" "$NAME"
          else
            7z a "$NAME.zip" "$NAME" >/dev/null
          fi

      # Build provenance（SLSA v1 attestation）：绑定本 run 与产物
      - name: Attest build provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: |
            dcinfer-*.tar.gz
            dcinfer-*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dcinfer-*.tar.gz
            dcinfer-*.zip
            sbom-scan.json

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # 创建 release 与上传 assets
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum dcinfer-*.tar.gz dcinfer-*.zip > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@a4f117a9dd5572319a486154ec1147aebabd285c
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/dcinfer-*.tar.gz
            dist/dcinfer-*.zip
            dist/SHA256SUMS
            dist/sbom-scan.json
