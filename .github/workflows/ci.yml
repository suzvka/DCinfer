name: CI

# 默认最小权限；需要写权限的 workflow（release.yml）自行声明。第三方 action
# 全部 pin 到不可变 commit SHA；checkout 关闭凭据持久化，避免 GITHUB_TOKEN
# 泄漏进 runner 文件系统。
permissions:
  contents: read

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-only:
    name: Core only (no vcpkg)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ pkg-config

      - name: Configure (core-only preset)
        run: cmake --preset core-only

      - name: Verify no vcpkg install happens
        run: |
          if [ -d build/core-only/vcpkg_installed ]; then
            echo "::error::core-only must not install vcpkg dependencies"
            exit 1
          fi

      - name: Build
        run: cmake --build build/core-only -j

  # README「10 分钟上手」的可运行守护：逐字执行其配置/构建命令、校验预期输出
  readme-hello-graph:
    name: README quick start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false # 验证零依赖路径：核心+Builtin 无需 vcpkg submodule
          persist-credentials: false

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # 与 README「10 分钟上手」逐字一致：不带 vcpkg toolchain，验证与 README
      # 相同的零依赖路径；修改 README 必须同步此处
      - name: Configure (README command)
        run: cmake -B build -S . -G Ninja -DBUILD_ENGINE_BUILTIN=ON

      - name: Build (README command)
        run: cmake --build build

      - name: Verify no vcpkg install happens
        shell: bash
        run: |
          if [ -d build/vcpkg_installed ]; then
            echo "::error::README quickstart must not install vcpkg dependencies"
            exit 1
          fi

      - name: Run hello_graph (expect "3.0 + 4.0 = 7")
        shell: pwsh
        run: |
          $out = & ./build/bin/hello_graph
          $out | Write-Host
          if (-not ($out -join "`n").Contains("3.0 + 4.0 = 7")) {
            Write-Host "::error::hello_graph output mismatch"
            exit 1
          }

      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120 --no-tests=error

  # 时间敏感测试以 --repeat until-fail 加严（Flaky 守护）
  dcnet-openai:
    name: DCNet + OpenAI mock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ pkg-config

      - name: Setup Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723

      - name: Setup MSVC (Windows x64)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      # Windows runner 默认 pwsh：含点参数值会被参数重写按点拆开、配置期直接
      # 失败，含点值必须整体加引号
      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_TOOLCHAIN_FILE=cmake/vcpkg-toolchain.cmake"
          -DDCINFER_BUILD_DCNET=ON
          -DBUILD_ENGINE_BUILTIN=ON
          -DBUILD_ENGINE_OPENAI=ON

      - name: Build
        run: cmake --build build -j

      - name: Assert OpenAiEngineTest registered (F11 guard)
        shell: bash
        run: |
          ctest --test-dir build -N -R "OpenAiEngineTest" | grep -q "OpenAiEngineTest" \
            || { echo "::error::OpenAiEngineTest is not registered (DCINFER_BUILD_TESTS wiring)"; exit 1; }

      - name: Test (full suite)
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120 --no-tests=error

      - name: Time-sensitive tests x3 (until-fail)
        run: ctest --test-dir build -C Release -R "InferGraphTest|GraphOperatorTest" --repeat until-fail:3 --output-on-failure --timeout 120 --no-tests=error

  msvc-release:
    name: Windows MSVC Release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Configure (MSVC Release)
        shell: pwsh
        run: |
          cmake --preset msvc-release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build/msvc-release --config Release

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build/msvc-release -C Release --output-on-failure --timeout 120 --no-tests=error

  gcc-release:
    name: Linux GCC Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ pkg-config

      - name: Configure (GCC Release)
        run: |
          cmake --preset gcc-release

      - name: Build
        run: |
          cmake --build build/gcc-release --config Release

      - name: Test
        run: |
          ctest --test-dir build/gcc-release -C Release --output-on-failure --timeout 120 --no-tests=error

  clang-release:
    name: Linux Clang Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config

      - name: Configure (Clang Release)
        run: |
          cmake --preset clang-release

      - name: Build
        run: |
          cmake --build build/clang-release --config Release

      - name: Test
        run: |
          ctest --test-dir build/clang-release -C Release --output-on-failure --timeout 120 --no-tests=error

  # MSVC 无 TSan；若协程跨线程恢复引发 fiber 误报，先收敛到 FreezeBoundaryTest
  # 子集再逐步扩围
  tsan:
    name: Linux GCC ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false # 核心测试零 vcpkg 依赖
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ pkg-config

      - name: Configure (TSan)
        run: >
          cmake -B build-tsan -S . -G Ninja
          -DBUILD_ENGINE_BUILTIN=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan -j

      - name: Concurrency tests under TSan
        run: >
          ctest --test-dir build-tsan
          -R "FreezeBoundaryTest|GraphOperatorTest|GraphInterfaceTest|InferGraphTest|LoweringTest|TaskLifecycleRegressionTest|ExecutionConcurrencyTest|ThreadPoolTest|ValueSharingTest|FailureClosureTest|ResourceSchedulerTest"
          --output-on-failure --timeout 120 --no-tests=error

      - name: Freeze-boundary repeated (until-fail x3)
        run: >
          ctest --test-dir build-tsan
          -R "FreezeBoundaryTest"
          --repeat until-fail:3
          --output-on-failure --timeout 120 --no-tests=error

  # 安装闭环冒烟：构建 → cmake --install → 独立工程 find_package → 链接 → 运行。
  # 版本请求由 install_smoke 的 CMakeLists 强约束（SameMinorVersion），minor
  # 升级漏同步时本作业红灯。
  install-smoke:
    name: Install smoke (find_package loopback)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ pkg-config

      # 安装树一：core-ir 预设——覆盖 DCinfer 与 DCIr 两个包
      - name: Configure (core-ir preset)
        run: cmake --preset core-ir -DCMAKE_INSTALL_INCLUDEDIR=inc

      - name: Build (core-ir)
        run: cmake --build build/core-ir -j

      - name: Install to prefix (DCinfer + DCIr)
        run: cmake --install build/core-ir --prefix "${{ github.workspace }}/install-prefix"

      # 安装树二：DCNet + Builtin——冒烟三/四所需包（core-ir 不开引擎/网络）
      - name: Configure (net + builtin)
        run: >
          cmake -B build/core-net -S . -G Ninja
          -DCMAKE_INSTALL_INCLUDEDIR=inc
          -DCMAKE_TOOLCHAIN_FILE=cmake/vcpkg-toolchain.cmake
          -DDCINFER_BUILD_DCNET=ON
          -DBUILD_ENGINE_BUILTIN=ON

      - name: Build (net + builtin)
        run: cmake --build build/core-net -j

      - name: Install to prefix (DCNet + DCEngine)
        run: cmake --install build/core-net --prefix "${{ github.workspace }}/install-prefix-net"

      # 冒烟一：core（DCinfer 单包 + 强约束版本请求）
      - name: Smoke test (core)
        run: |
          cmake -B build-smoke-core -S examples/install_smoke \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-prefix"
          cmake --build build-smoke-core -j
          ./build-smoke-core/install_smoke | grep -q "install smoke OK"

      # 冒烟二：DCIr 安装链（依赖经 install_smoke manifest 的 feature 'ir' 解析）
      - name: Smoke test (with DCIr)
        run: |
          cmake -B build-smoke-ir -S examples/install_smoke \
            -DSMOKE_WITH_IR=ON \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-prefix" \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/cmake/vcpkg-toolchain.cmake" \
            -DDCINFER_BUILD_IR=ON
          cmake --build build-smoke-ir -j
          ./build-smoke-ir/install_smoke | grep -q "install smoke OK"

      # 冒烟三：Builtin 引擎安装链（零外部依赖）——真实跑一次算子图
      - name: Smoke test (with Builtin engine)
        run: |
          cmake -B build-smoke-builtin -S examples/install_smoke \
            -DSMOKE_WITH_BUILTIN=ON \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-prefix-net"
          cmake --build build-smoke-builtin -j
          ./build-smoke-builtin/install_smoke | grep -q "install smoke OK"

      # 冒烟四：DCNet 安装链（依赖经 install_smoke manifest 的 feature 'net'
      # 解析，由 toolchain wrapper 按 -DDCINFER_BUILD_DCNET=ON 注入）
      - name: Smoke test (with DCNet)
        run: |
          cmake -B build-smoke-net -S examples/install_smoke \
            -DSMOKE_WITH_NET=ON \
            -DDCINFER_BUILD_DCNET=ON \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-prefix-net" \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/cmake/vcpkg-toolchain.cmake"
          cmake --build build-smoke-net -j
          ./build-smoke-net/install_smoke | grep -q "install smoke OK"

  # ONNX Runtime 适配器不进 CI（仅本地验证，预设 msvc-ort-cpu / msvc-ort-cuda）；
  # CI 只验证核心逻辑与零/低依赖路径
  debug-sanitizers:
    name: Linux Debug ASan + UBSan (core and net)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++ pkg-config
      - run: >
          cmake -S . -B build/sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=cmake/vcpkg-toolchain.cmake
          -DDCINFER_BUILD_DCNET=ON -DBUILD_ENGINE_OPENAI=ON -DBUILD_ENGINE_BUILTIN=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build/sanitizers -j 2
      - run: ctest --test-dir build/sanitizers --output-on-failure --timeout 120 --no-tests=error

  atomic-32:
    name: GCC 32-bit atomic probe and core tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-11-multilib
      - run: >
          cmake -S . -B build/atomic32 -G Ninja
          -DCMAKE_CXX_COMPILER=g++-11 -DCMAKE_CXX_FLAGS=-m32
          -DCMAKE_EXE_LINKER_FLAGS=-m32 -DCMAKE_BUILD_TYPE=Debug
          -DDCINFER_BUILD_ENGINES=OFF -DDCINFER_BUILD_EXAMPLES=OFF
      - run: cmake --build build/atomic32 -j 2
      - run: ctest --test-dir build/atomic32 --output-on-failure --timeout 120 --no-tests=error

  minimum-toolchain:
    name: Minimum toolchain (${{ matrix.cxx }}, CMake 3.17.3)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-11, clang++-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-11 clang-14
      # PyPI 上 cmake 3.17.x 最高为 3.17.3（3.17.5 不存在），保持最小 3.17 线
      - run: python3 -m pip install --user cmake==3.17.3
      # Preset schema v3 needs newer CMake; exercise the advertised minimum via -S/-B.
      - run: >
          $HOME/.local/bin/cmake -S . -B build/minimum -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DDCINFER_BUILD_ENGINES=OFF -DDCINFER_BUILD_EXAMPLES=OFF
      - run: $HOME/.local/bin/cmake --build build/minimum -j 2
      - run: (cd build/minimum && $HOME/.local/bin/ctest --output-on-failure --timeout 120 --no-tests=error)
      - name: C++17 parent context remains unchanged
        run: |
          mkdir -p build/parent
          cat > build/parent/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.17)
          project(Parent LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_REQUIRED_LIBRARIES dcinfer_parent_probe_library_must_not_link)
          set(CMAKE_REQUIRED_FLAGS "-DPARENT_SENTINEL=1")
          add_subdirectory(../.. dcinfer)
          if(NOT CMAKE_CXX_STANDARD EQUAL 17 OR NOT CMAKE_REQUIRED_LIBRARIES STREQUAL "dcinfer_parent_probe_library_must_not_link" OR NOT CMAKE_REQUIRED_FLAGS STREQUAL "-DPARENT_SENTINEL=1")
            message(FATAL_ERROR "DCinfer changed parent probe context")
          endif()
          CMAKE
          $HOME/.local/bin/cmake -S build/parent -B build/parent-out -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DDCINFER_BUILD_ENGINES=OFF
          $HOME/.local/bin/cmake --build build/parent-out -j 2
